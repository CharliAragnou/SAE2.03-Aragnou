<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./component/MovieDetail/style.css" />
    <link rel="stylesheet" href="./component/MovieCategory/style.css" />
    <link rel="stylesheet" href="./component/NavBar/style.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { DataProfile } from "./data/dataProfile.js";
      import { MovieDetail } from "./component/MovieDetail/script.js";
      import { Movie } from "./component/Movie/script.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      // Variables globales pour le profil actif
      window.activeProfileId = null;
      window.activeProfileAge = 0;
      window.profiles = [];

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
        );
      };

      C.handlerList = function () {
        V.renderMovies();
      };

      C.handlerProfileChange = function (event) {
        const selectedId = event.target.value;
        window.activeProfileId = selectedId ? parseInt(selectedId) : null;
        const selectedProfile = window.profiles.find(p => p.id === window.activeProfileId);
        window.activeProfileAge = selectedProfile ? selectedProfile.min_age : 0;
        console.log("Profil actif changé :", window.activeProfileId, window.activeProfileAge);
        V.renderNavBar("C.handlerAbout()", window.profiles, window.activeProfileId);
        // Ici, on pourrait recharger les films en fonction du profil (filtrage par âge)
        V.renderMovies();
      };

      C.handlerDetail = async function (movieId) {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement du film...</div>`;
        try {
          let movie = await DataMovie.requestMovieDetails(movieId);
          content.innerHTML = MovieDetail.format(movie);
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">Impossible de charger les détails du film.</div>`;
          console.error(error);
        }
      };

      C.start = async function () {
        try {
          window.profiles = await DataProfile.read();
          V.renderNavBar("C.handlerAbout()", window.profiles, window.activeProfileId);
          V.renderMovies();
        } catch (error) {
          console.error("Erreur lors du chargement des profils :", error);
          V.renderNavBar("C.handlerAbout()", []);
          V.renderMovies();
        }
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout, profiles, selectedProfileId) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout, "C.handlerList()", profiles, "C.handlerProfileChange(event)", selectedProfileId);
      };

      V.renderMovies = async function () {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement des films...</div>`;

        try {
          let categories = await DataMovie.requestMovies(window.activeProfileAge || 0);
          categories = categories.filter(category => category.movies && category.movies.length > 0);
          if (categories.length === 0) {
            content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">Aucun film disponible pour votre tranche d'âge.</div>`;
            return;
          }
          let html = '';
          for (let category of categories) {
            html += MovieCategory.format(category);
          }
          content.innerHTML = html;
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;
              font-weight: 600;">Impossible de charger les films pour le moment.</div>`;
          console.error(error);
        }
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
