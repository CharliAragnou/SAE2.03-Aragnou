<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./component/MovieDetail/style.css" />
    <link rel="stylesheet" href="./component/MovieCategory/style.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import { NavBar } from "./component/NavBar/script.js";
      import { DataMovie } from "./data/dataMovie.js";
      import { MovieDetail } from "./component/MovieDetail/script.js";
      import { Movie } from "./component/Movie/script.js";
      import { MovieCategory } from "./component/MovieCategory/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
        );
      };

      C.handlerList = function () {
        V.renderMovies();
      };

      C.handlerDetail = async function (movieId) {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement du film...</div>`;
        try {
          let movie = await DataMovie.requestMovieDetails(movieId);
          content.innerHTML = MovieDetail.format(movie);
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">Impossible de charger les détails du film.</div>`;
          console.error(error);
        }
      };

      C.start = function () {
        V.renderNavBar("C.handlerAbout()");
        V.renderMovies();
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(hAbout, "C.handlerList()");
      };

      V.renderMovies = async function () {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement des films...</div>`;

        try {
          let categories = await DataMovie.requestMovies();
          let html = '';
          for (let category of categories) {
            html += MovieCategory.format(category);
          }
          content.innerHTML = html;
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;
              font-weight: 600;">Impossible de charger les films pour le moment.</div>`;
          console.error(error);
        }
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
