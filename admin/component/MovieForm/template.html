<form id="movie-form" class="movie-form">
  <h2>Ajouter un film</h2>

  <div class="form-group">
    <label for="title">Titre du film *</label>
    <input type="text" id="title" name="title" required>
  </div>

  <div class="form-group">
    <label for="director">Réalisateur *</label>
    <input type="text" id="director" name="director" required>
  </div>

  <div class="form-group">
    <label for="year">Année de sortie *</label>
    <input type="number" id="year" name="year" min="1900" max="2030" required>
  </div>

  <div class="form-group">
    <label for="length">Durée (minutes) *</label>
    <input type="number" id="length" name="length" min="1" required>
  </div>

  <div class="form-group">
    <label for="description">Description *</label>
    <textarea id="description" name="description" rows="4" required></textarea>
  </div>

  <div class="form-group">
    <label for="category">Catégorie *</label>
    <select id="category" name="category" required>
      <option value="">Sélectionner une catégorie</option>
      <option value="1">Action</option>
      <option value="2">Comédie</option>
      <option value="3">Drame</option>
      <option value="4">Science-fiction</option>
      <option value="5">Animation</option>
      <option value="6">Thriller</option>
      <option value="7">Horreur</option>
      <option value="8">Aventure</option>
      <option value="9">Fantaisie</option>
      <option value="10">Documentaire</option>
    </select>
  </div>

  <div class="form-group">
    <label for="image">Nom du fichier image *</label>
    <input type="text" id="image" name="image" placeholder="ex: mon_film.jpg" required>
  </div>

  <div class="form-group">
    <label for="trailer">URL du trailer</label>
    <input type="url" id="trailer" name="trailer" placeholder="https://...">
  </div>

  <div class="form-group">
    <label for="min_age">Restrictions d'âge</label>
    <input type="number" id="min_age" name="min_age" min="0" max="18" placeholder="0">
  </div>

  <button type="submit" class="submit-btn">Ajouter le film</button>
</form>
