<form id="profile-form" class="profile-form">
  <h2>Ajouter un profil utilisateur</h2>

  <div class="form-group">
    <label for="name">Nom du profil *</label>
    <input type="text" id="name" name="name" required>
  </div>

  <div class="form-group">
    <label for="avatar">Avatar (URL)</label>
    <input type="url" id="avatar" name="avatar" placeholder="https://...">
  </div>

  <div class="form-group">
    <label for="min_age">Restrictions d'âge</label>
    <select id="min_age" name="min_age">
      <option value="0">Tous publics</option>
      <option value="12">12 ans et plus</option>
      <option value="16">16 ans et plus</option>
      <option value="18">18 ans et plus</option>
    </select>
  </div>

  <button type="submit" class="submit-btn">Ajouter le profil</button>
</form>
