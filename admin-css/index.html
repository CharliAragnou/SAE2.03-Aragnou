<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMIN</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./component/MovieForm/style.css" />
    <link rel="stylesheet" href="./component/ProfileForm/style.css" />
    <link rel="stylesheet" href="./component/MovieSearch/style.css" />
  </head>
  <body>
    <section id="log"></section>
    <section id="form-container"></section>

    <script type="module">
      import Log from "./component/Log/script.js";
      import MovieForm from "./component/MovieForm/script.js";
      import ProfileForm from "./component/ProfileForm/script.js";
      import MovieSearch from "./component/MovieSearch/script.js";
      import DataMovie from "./data/dataMovie.js";
      import DataProfile from "./data/dataProfile.js";

      window.C = {};

      window.profileList = [];
      window.selectedProfileId = null;
      window.movieSearchResults = null;

      C.handlerAddMovie = async function(event) {
        event.preventDefault();
        V.renderLog("Envoi du formulaire en cours...");

        try {
          let form = document.getElementById('movie-form');
          let formData = new FormData(form);

          let response = await DataMovie.add(formData);
          V.renderLog("Succès : " + response.message);
          form.reset();
        } catch (error) {
          V.renderLog("Erreur : " + error.message);
        }
      };

      C.handlerAddProfile = async function(event) {
        event.preventDefault();
        V.renderLog("Envoi du formulaire en cours...");

        try {
          let form = document.getElementById('profile-form');
          let formData = new FormData(form);

          let response = await DataProfile.add(formData);
          V.renderLog("Succès : " + response.message);
          form.reset();
          window.selectedProfileId = null;
          window.profileList = await DataProfile.read();
          V.renderMovieSearch();
        } catch (error) {
          V.renderLog("Erreur : " + error.message);
        }
      };

      C.handlerProfileSelect = function(event) {
        const selectedId = event.target.value ? parseInt(event.target.value) : null;
        window.selectedProfileId = selectedId;
        const profile = window.profileList.find(p => p.id === selectedId);
        let form = document.getElementById('profile-form');
        if (!form) return;
        form.querySelector('#profile-id').value = profile ? profile.id : '';
        form.querySelector('#name').value = profile ? profile.name : '';
        form.querySelector('#avatar').value = profile ? profile.avatar || '' : '';
        form.querySelector('#min_age').value = profile ? profile.min_age : '0';
        let submitBtn = form.querySelector('.submit-btn');
        submitBtn.textContent = profile ? 'Modifier le profil' : 'Ajouter le profil';
      };

      C.handlerSearchMovies = async function(event) {
        event.preventDefault();
        V.renderLog("Recherche en cours...");

        try {
          const search = document.getElementById('search-title').value.trim();
          const category = parseInt(document.getElementById('search-category').value, 10) || 0;
          const year = parseInt(document.getElementById('search-year').value, 10) || 0;

          const groupedMovies = await DataMovie.requestMovies(search, category, year);
          const flatMovies = [];
          if (Array.isArray(groupedMovies)) {
            for (const categoryGroup of groupedMovies) {
              if (Array.isArray(categoryGroup.movies)) {
                for (const movie of categoryGroup.movies) {
                  flatMovies.push({
                    id: movie.id,
                    title: movie.title,
                    category: categoryGroup.name || '',
                    featured: movie.featured || 0
                  });
                }
              }
            }
          }

          window.movieSearchResults = flatMovies;
          V.renderMovieSearchResults();
          if (flatMovies.length === 0) {
            V.renderLog("Aucun film ne correspond à votre recherche.");
          } else {
            V.renderLog("Résultats de la recherche affichés.");
          }
        } catch (error) {
          V.renderLog("Erreur lors de la recherche : " + error.message);
        }
      };

      C.handlerToggleFeatured = async function(movieId, currentFeatured) {
        try {
          const newFeatured = currentFeatured ? 0 : 1;
          const response = await DataMovie.updateFeaturedStatus(movieId, newFeatured);
          if (response && response.success) {
            V.renderLog(response.message);
            await C.refreshSearchResults();
          } else {
            V.renderLog(response.message || 'Erreur lors de la mise à jour du statut.');
          }
        } catch (error) {
          V.renderLog("Erreur lors de la mise à jour : " + error.message);
        }
      };

      C.refreshSearchResults = async function() {
        const form = document.getElementById('movie-search-form');
        if (!form) return;
        const event = new Event('submit');
        form.dispatchEvent(event);
      };

      C.start = async function () {
        V.renderLog("Démarrage de l'application");
        try {
          window.profileList = await DataProfile.read();
        } catch (error) {
          V.renderLog("Erreur de chargement des profils : " + error.message);
          window.profileList = [];
        }
        V.renderMovieSearch();
      };

      window.V = {};

      V.renderLog = function (txt) {
        let content = document.querySelector("#log");
        content.innerHTML = Log.format(txt);
      };

      V.renderMovieForm = function () {
        let formContainer = document.querySelector("#form-container");
        formContainer.innerHTML = MovieSearch.format() + MovieForm.format() + ProfileForm.format(window.profileList, window.selectedProfileId);

        // Attach event listeners after rendering
        document.getElementById('movie-search-form').addEventListener('submit', C.handlerSearchMovies);
        document.getElementById('movie-form').addEventListener('submit', C.handlerAddMovie);
        document.getElementById('profile-form').addEventListener('submit', C.handlerAddProfile);
        document.getElementById('profile-select').addEventListener('change', C.handlerProfileSelect);
        V.renderMovieSearchResults();
      };

      V.renderMovieSearch = function () {
        let formContainer = document.querySelector("#form-container");
        formContainer.innerHTML = MovieSearch.format() + MovieForm.format() + ProfileForm.format(window.profileList, window.selectedProfileId);
        document.getElementById('movie-search-form').addEventListener('submit', C.handlerSearchMovies);
        document.getElementById('movie-form').addEventListener('submit', C.handlerAddMovie);
        document.getElementById('profile-form').addEventListener('submit', C.handlerAddProfile);
        document.getElementById('profile-select').addEventListener('change', C.handlerProfileSelect);
        V.renderMovieSearchResults();
      };

      V.renderMovieSearchResults = function () {
        const resultsContainer = document.getElementById('movie-search-results');
        if (!resultsContainer) return;
        if (window.movieSearchResults === null) {
          resultsContainer.innerHTML = '';
          return;
        }

        if (!window.movieSearchResults || window.movieSearchResults.length === 0) {
          resultsContainer.innerHTML = '<div class="movie-search-empty">Aucun film ne correspond à votre recherche.</div>';
          return;
        }

        let html = '';
        for (const movie of window.movieSearchResults) {
          html += `<div class="movie-search-card">
            <h3>${movie.title}</h3>
            <p><strong>Catégorie :</strong> ${movie.category || 'Indéterminée'}</p>
            <p class="movie-status"><strong>Statut :</strong> ${movie.featured ? 'Mis en avant' : 'Non mis en avant'}</p>
            <div class="movie-actions">
              <button class="${movie.featured ? 'unfeatured-btn' : 'featured-btn'}" onclick="C.handlerToggleFeatured(${movie.id}, ${movie.featured})">
                ${movie.featured ? 'Retirer du statut mis en avant' : 'Attribuer statut mis en avant'}
              </button>
            </div>
          </div>`;
        }

        resultsContainer.innerHTML = html;
      };

      C.start();
    </script>
  </body>
</html>
