<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 APP</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./component/MovieDetail/style.css" />
    <link rel="stylesheet" href="./component/MovieCategory/style.css" />
    <link rel="stylesheet" href="./component/NavBar/style.css" />
    <link rel="stylesheet" href="./component/Movie/style.css" />
    <link rel="stylesheet" href="./component/FavoritesList/style.css" />
    <link rel="stylesheet" href="./component/FeaturedMovies/style.css" />
    <link rel="stylesheet" href="./component/Statistics/style.css" />
  </head>

  <body>
    <header id="header"></header>

    <section id="content"></section>

    <script type="module">
      import NavBar from "./component/NavBar/script.js";
      import DataMovie from "./data/dataMovie.js";
      import DataProfile from "./data/dataProfile.js";
      import DataFavorite from "./data/dataFavorite.js";
      import DataFeatured from "./data/dataFeatured.js";
      import DataStatistics from "./data/dataStatistics.js";
      import MovieDetail from "./component/MovieDetail/script.js";
      import Movie from "./component/Movie/script.js";
      import MovieCategory from "./component/MovieCategory/script.js";
      import FavoritesList from "./component/FavoritesList/script.js";
      import FeaturedMovies from "./component/FeaturedMovies/script.js";
      import Statistics from "./component/Statistics/script.js";

      // Controleur
      // Rappel, écrire window.C plutôt que let C est nécessaire pour tester depuis la console du navigateur
      // Une fois l'application terminée, on pourrait remettre let C.
      window.C = {};

      // Variables globales pour le profil actif
      window.activeProfileId = null;
      window.activeProfileAge = 0;
      window.profiles = [];
      window.favorites = [];
      window.featured = [];
      window.searchQuery = '';

      C.handlerAbout = function () {
        alert(
          "Ceci est une base de projet pour la SAE2.03 édition 2025. Bonne chance !"
        );
      };

      C.handlerList = function () {
        window.searchQuery = '';
        V.renderNavBar("C.handlerAbout()", window.profiles, window.activeProfileId);
        V.renderMovies();
      };

      C.handlerProfileChange = function (event) {
        const selectedId = event.target.value;
        window.activeProfileId = selectedId ? parseInt(selectedId) : null;
        const selectedProfile = window.profiles.find(p => p.id === window.activeProfileId);
        window.activeProfileAge = selectedProfile ? selectedProfile.min_age : 0;

        console.log("Profil actif changé :", window.activeProfileId, window.activeProfileAge);
        V.renderNavBar("C.handlerAbout()", window.profiles, window.activeProfileId);
        V.loadFavorites();
        V.renderMovies();
      };

      C.handlerToggleFavorite = async function (movieId, event) {
        if (!window.activeProfileId) {
          alert("Veuillez sélectionner un profil d'abord.");
          return;
        }

        const isFav = window.favorites.some(fav => fav.id === movieId);
        
        try {
          if (isFav) {
            await DataFavorite.remove(window.activeProfileId, movieId);
            window.favorites = window.favorites.filter(fav => fav.id !== movieId);
          } else {
            const result = await DataFavorite.add(window.activeProfileId, movieId);
            if (result.success) {
              // Reload favorites to get the full data
              window.favorites = await DataFavorite.read(window.activeProfileId);
            }
          }
          V.renderMovies();
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors de la gestion des favoris.");
        }
      };

      C.handlerRemoveFavorite = async function (movieId, event) {
        if (!window.activeProfileId) {
          return;
        }

        try {
          await DataFavorite.remove(window.activeProfileId, movieId);
          window.favorites = window.favorites.filter(fav => fav.id !== movieId);
          alert("Le film a été retiré de vos favoris.");
          V.renderMovies();
        } catch (error) {
          console.error("Erreur:", error);
          alert("Erreur lors de la suppression du film des favoris.");
        }
      };

      C.handlerShowFavorites = function () {
        V.renderFavorites();
      };

      C.handleShowMovies = function () {
        window.searchQuery = '';
        const searchInput = document.querySelector('#search-input');
        if (searchInput) {
          searchInput.value = '';
        }
        V.renderNavBar("C.handlerAbout()", window.profiles, window.activeProfileId);
        V.renderMovies();
      };

      C.handleSearch = function (event) {
        window.searchQuery = event.target.value.trim();
        V.renderMovies();
      };

      C.handleSearchClick = function () {
        const input = document.querySelector('#search-input');
        if (input) {
          window.searchQuery = input.value.trim();
        }
        V.renderMovies();
      };

      C.handlerShowStatistics = function () {
        V.renderStatistics();
      };

      C.handlerDetail = async function (movieId) {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement du film...</div>`;
        try {
          let movie = await DataMovie.requestMovieDetails(movieId);
          content.innerHTML = MovieDetail.format(movie);
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">Impossible de charger les détails du film.</div>`;
          console.error(error);
        }
      };

      C.start = async function () {
        try {
          window.profiles = await DataProfile.read();
          V.renderNavBar("C.handlerAbout()", window.profiles, window.activeProfileId);
          V.renderMovies();
        } catch (error) {
          console.error("Erreur lors du chargement des profils :", error);
          V.renderNavBar("C.handlerAbout()", []);
          V.renderMovies();
        }
      };

      // Vue (contient tout ce qui est relatif à l'affichage)
      window.V = {};

      /**
       * V.renderNavBar
       *
       * Cette fonction est responsable de l'affichage de la barre de navigation (NavBar).
       * Elle sélectionne l'élément HTML avec l'ID "header" et y insère le contenu
       * formaté par le composant NavBar.
       */
      V.renderNavBar = function (hAbout, profiles, selectedProfileId) {
        let header = document.querySelector("#header");
        header.innerHTML = NavBar.format(
          hAbout,
          "C.handlerList()",
          profiles,
          "C.handlerProfileChange(event)",
          selectedProfileId,
          "C.handlerShowStatistics()",
          "C.handleSearch(event)",
          "C.handleSearchClick()",
          window.searchQuery
        );
      };

      V.loadFavorites = async function () {
        if (!window.activeProfileId) {
          window.favorites = [];
          return;
        }

        try {
          window.favorites = await DataFavorite.read(window.activeProfileId);
        } catch (error) {
          console.error("Erreur lors du chargement des favoris:", error);
          window.favorites = [];
        }
      };

      V.loadFeatured = async function () {
        try {
          window.featured = await DataFeatured.read(window.activeProfileAge || 0);
        } catch (error) {
          console.error("Erreur lors du chargement des films mis en avant:", error);
          window.featured = [];
        }
      };

      V.renderMovies = async function () {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement des films...</div>`;

        try {
          // Load favorites if profile is selected
          if (window.activeProfileId) {
            await V.loadFavorites();
          }

          // Load featured movies
          await V.loadFeatured();

          let categories = await DataMovie.requestMovies(window.activeProfileAge || 0, window.searchQuery || '', 0, 0);
          categories = categories.filter(category => category.movies && category.movies.length > 0);
          const isSearchActive = window.searchQuery && window.searchQuery.length > 0;
          if (categories.length === 0) {
            content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">${isSearchActive ? 'Aucun film ne correspond à votre recherche.' : 'Aucun film disponible pour votre tranche d\'âge.'}</div>`;
            return;
          }
          
          // Get favorite IDs
          const favoriteIds = window.favorites.map(fav => fav.id);
          
          let html = '';
          if (!isSearchActive) {
            // Add featured movies section only when not searching
            const featuredHtml = await FeaturedMovies.format(window.featured, favoriteIds);
            html += featuredHtml;
            
            if (window.favorites && window.favorites.length > 0) {
              html += FavoritesList.format(window.favorites);
            }
          }
          for (let category of categories) {
            html += MovieCategory.format(category, favoriteIds);
          }
          content.innerHTML = html;
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;
              font-weight: 600;">Impossible de charger les films pour le moment.</div>`;
          console.error(error);
        }
      };

      V.renderFavorites = function () {
        let content = document.querySelector("#content");
        if (!window.activeProfileId) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">Veuillez sélectionner un profil pour voir vos favoris.</div>`;
          return;
        }
        content.innerHTML = FavoritesList.format(window.favorites);
      };

      V.renderStatistics = async function () {
        let content = document.querySelector("#content");
        content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center;">Chargement des statistiques...</div>`;

        try {
          const stats = await DataStatistics.read();
          const statsHtml = await Statistics.format(stats);
          content.innerHTML = statsHtml;
        } catch (error) {
          content.innerHTML = `<div class="font-sans" style="padding: 2rem; text-align: center; font-weight: 600;">Impossible de charger les statistiques pour le moment.</div>`;
          console.error(error);
        }
      };

      C.start(); // Démarre l'application
    </script>
  </body>
</html>
