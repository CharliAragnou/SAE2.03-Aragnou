<article class="movie-card font-sans" data-id="{{id}}" onclick="C.handlerDetail({{id}})">
  <button class="movie-favorite-btn {{favoriteClass}}" data-id="{{id}}" onclick="event.stopPropagation(); C.handlerToggleFavorite({{id}}, event)">{{favoriteIcon}}</button>
  <img src="../server/images/{{poster}}" alt="Affiche de {{title}}" class="movie-poster">
  <div class="movie-info">
    <h3 class="movie-title">{{title}}</h3>
  </div>
</article>
